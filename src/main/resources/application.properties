# ? BASIC
spring.application.name=E-voting_System
server.port=${PORT:8082}

# ? DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/E_voting_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ? MAIL (OTP EMAIL)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
evoting.mail.from=${MAIL_USERNAME}

# ? TWILIO
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.verify-service-sid=${TWILIO_VERIFY_SID}
twilio.enabled=${TWILIO_ENABLED:false}

# ? FAST2SMS
fast2sms.api-key=${FAST2SMS_API_KEY:}
fast2sms.enabled=${FAST2SMS_ENABLED:true}

# ? SECURITY
evoting.security.aadhaar-pepper=${AADHAAR_PEPPER}

# ? ADMIN CREDENTIALS
evoting.admin.username=${ADMIN_USERNAME:admin}
evoting.admin.password-hash=${ADMIN_PASSWORD_HASH}

# ? SESSION
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=strict

# ? API KEY
app.api-key=${APP_API_KEY:EVOTING-ADMIN-KEY}

# ? SECURITY: suppress default user creation
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ? LOGGING
logging.level.org.springframework.security=WARN
logging.level.org.springframework.jcl=ERROR
logging.level.com.example.E_voting_System=INFO

# ? CONNECTION POOL (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=EVotingHikariPool