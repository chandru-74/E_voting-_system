<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time voting results">
    <title>Live Results - E-Voting System</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .results-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: var(--shadow);
            animation: pulse 2s ease-in-out infinite;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .result-item {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border: 2px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
        }

        .result-item:hover {
            border-color: var(--primary-light);
            transform: translateX(4px);
            box-shadow: var(--shadow-lg);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        .candidate-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 0;
        }

        .candidate-avatar {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .candidate-details {
            flex: 1;
            min-width: 0;
        }

        .candidate-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .candidate-party {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0.25rem 0 0 0;
        }

        .vote-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }

        .vote-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .vote-count {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .vote-label {
            font-size: 0.7rem;
            opacity: 0.9;
            margin-top: 0.25rem;
        }

        .progress-section {
            margin-top: 1rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .progress-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .progress-percentage {
            color: var(--primary-light);
            font-weight: 700;
            font-size: 1rem;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 6px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 2px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .rank-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
            border: 2px solid var(--border);
            border-radius: 50%;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .rank-badge.first {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-color: #d97706;
            color: white;
        }

        .rank-badge.second {
            background: linear-gradient(135deg, #d1d5db, #9ca3af);
            border-color: #6b7280;
            color: #1f2937;
        }

        .rank-badge.third {
            background: linear-gradient(135deg, #e2beaa, #d2691e);
            border-color: #8b4513;
            color: white;
        }

        .loading-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .loading-spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .refresh-info {
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid var(--info);
            color: #7dd3fc;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .refresh-icon {
            animation: spin 2s linear infinite;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .results-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .results-title {
                font-size: 1.75rem;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .vote-info {
                width: 100%;
                margin-top: 1rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .candidate-name {
                font-size: 0.95rem;
            }

            .vote-count {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="results-header">
        <h1 class="results-title">📊 Live Results</h1>
        <div class="live-badge">
            <span class="live-dot"></span>
            <span>LIVE</span>
        </div>
    </div>

    <div class="refresh-info">
        <span class="refresh-icon">🔄</span>
        <span>Results update in real-time as votes are cast</span>
    </div>

    <!-- Statistics -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-label">Total Votes</div>
            <div class="stat-value" id="totalVotes">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Leading Candidate</div>
            <div class="stat-value" id="leadingCandidate" style="font-size: 1.3rem; text-align: left; padding-left: 0.5rem;">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Candidates</div>
            <div class="stat-value" id="candidateCount">0</div>
        </div>
    </div>

    <!-- Results List -->
    <div class="results-list" id="results">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading live results...</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="nav-links" style="margin-top: 3rem; justify-content: center;">
        <a href="/voter" class="nav-link">
            <span>🔙</span> Back to Voting
        </a>
        <a href="/voter/final" class="nav-link">
            <span>🏁</span> Final Results
        </a>
    </nav>
</div>

<script>
    const resultsContainer = document.getElementById('results');
    let resultsData = {};
    let maxVotes = 0;

    // Initial load
    function loadInitialResults() {
        // Results will be loaded from EventSource
        setupEventSource();
    }

    function setupEventSource() {
        const eventSource = new EventSource('/api/stream/events');

        eventSource.onmessage = function(event) {
            try {
                resultsData = JSON.parse(event.data);
                updateResults();
            } catch (error) {
                console.error('Error parsing results:', error);
            }
        };

        eventSource.onerror = function() {
            console.log('EventSource connection error or closed');
            resultsContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <p>Connection lost. Please refresh the page.</p>
                </div>
            `;
        };

        window.addEventListener('beforeunload', () => {
            eventSource.close();
        });
    }

    function updateResults() {
        if (!resultsData || Object.keys(resultsData).length === 0) {
            resultsContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🗳️</div>
                    <p>No votes cast yet. Be the first to vote!</p>
                </div>
            `;
            updateStats();
            return;
        }

        // Calculate total votes and max
        let totalVotes = 0;
        maxVotes = 0;

        const entries = Object.entries(resultsData).map(([name, votes]) => {
            totalVotes += votes;
            if (votes > maxVotes) maxVotes = votes;
            return { name, votes };
        });

        // Sort by votes descending
        entries.sort((a, b) => b.votes - a.votes);

        // Render results
        resultsContainer.innerHTML = entries.map((entry, index) => {
            const percentage = maxVotes > 0 ? (entry.votes / maxVotes) * 100 : 0;
            const rank = index + 1;
            let rankClass = '';
            if (rank === 1) rankClass = 'first';
            else if (rank === 2) rankClass = 'second';
            else if (rank === 3) rankClass = 'third';

            return `
                <div class="result-item" data-votes="${entry.votes}">
                    <div class="result-header">
                        <div class="rank-badge ${rankClass}">${rank}</div>
                        <div class="candidate-info">
                            <span class="candidate-avatar">👤</span>
                            <div class="candidate-details">
                                <h3 class="candidate-name">${escapeHtml(entry.name)}</h3>
                            </div>
                        </div>
                        <div class="vote-info">
                            <div class="vote-badge">
                                <div class="vote-count">${entry.votes}</div>
                                <div class="vote-label">VOTES</div>
                            </div>
                        </div>
                    </div>

                    <div class="progress-section">
                        <div class="progress-header">
                            <span class="progress-label">Vote Share</span>
                            <span class="progress-percentage">${percentage.toFixed(1)}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.max(2, percentage)}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        updateStats();
    }

    function updateStats() {
        const totalVotes = Object.values(resultsData).reduce((a, b) => a + b, 0);
        const leadingCandidate = Object.entries(resultsData)
            .sort((a, b) => b[1] - a[1])[0];

        document.getElementById('totalVotes').textContent = totalVotes;
        document.getElementById('candidateCount').textContent = Object.keys(resultsData).length;
        document.getElementById('leadingCandidate').textContent = leadingCandidate
            ? leadingCandidate[0].substring(0, 20) + (leadingCandidate[0].length > 20 ? '...' : '')
            : '-';
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Load results on page load
    document.addEventListener('DOMContentLoaded', loadInitialResults);
</script>
</body>
</html>
